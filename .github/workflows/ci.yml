name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, then runs the Testcontainers suite (Docker is available on GitHub-hosted runners).
      - name: Build and test
        run: ./mvnw -B verify
