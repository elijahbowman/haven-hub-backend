services:
  postgres:
    image: 'postgres:latest'
    volumes:
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/postgresql/:/var/lib/postgresql/data
    environment:
#      - PGDATA=./docker/postgresql
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - 127.0.0.1:5432:5432
