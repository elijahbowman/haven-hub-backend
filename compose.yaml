services:
  postgres:
    # Pinned to a major version: data directories are not compatible across
    # major versions, and postgres:18+ images changed the default data path.
    # Must match ./data/postgresql/PG_VERSION if a local volume already exists.
    image: 'postgres:17'
    volumes:
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/postgresql/:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - 127.0.0.1:5432:5432
