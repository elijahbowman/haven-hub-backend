logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: DEBUG
    hearthway: DEBUG

spring:
  profiles:
    # Used only when no profile is set; production sets SPRING_PROFILES_ACTIVE=prod.
    default: dev
  application:
    name: hearthway-backend
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: Hikari
      auto-commit: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    web:
      pageable:
        # Public endpoints are paginated; cap the page size so ?size=100000 can't
        # load every listing at once.
        max-page-size: 50
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hearthway
  liquibase:
    contexts: dev
    change-log: classpath:db/changelog/master.xml
    default-schema: hearthway
    enabled: true
  #    drop-first: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
server:
  port: 8080

okta:
  oauth2:
    issuer: https://dev-gzdtqbwadivvkcvz.us.auth0.com/
    client-id: ${AUTH0_CLIENT_ID}
    client-secret: ${AUTH0_CLIENT_SECRET}

application:
  auth0:
    role-landlord-id: rol_owJc48mOUZf0gD42
