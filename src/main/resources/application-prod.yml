logging:
  level:
    ROOT: info
    org.hibernate.SQL: INFO
    hearthway: INFO

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_URL}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: hearthway
  liquibase:
    contexts: prod
    default-schema: hearthway

application:
  auth0:
    # Where users land after login. "/" works when the SPA and API share one origin.
    redirect-url: ${AUTH0_REDIRECT_URL:/}
